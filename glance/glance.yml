# CommandCenter layout. Docs: https://github.com/glanceapp/glance/blob/main/docs/configuration.md
# Env vars come from docker-compose (which reads ../.env).

server:
  host: 0.0.0.0
  port: 8080
  assets-path: /app/assets

theme:
  # Phosphor-amber on near-black. Tweak freely, or use the on-screen picker.
  background-color: 220 16 7
  primary-color: 35 95 62
  positive-color: 135 50 55
  negative-color: 5 78 62
  contrast-multiplier: 1.15
  text-saturation-multiplier: 0.9
  custom-css-file: /assets/theme.css

pages:
  - name: Command Center
    width: wide
    hide-desktop-navigation: true
    center-vertically: false

    columns:
      # ── LEFT ────────────────────────────────────────────────────────────
      - size: small
        widgets:
          - type: clock
            hour-format: 24h

          - type: weather
            location: ${WEATHER_LOCATION}
            units: ${WEATHER_UNITS}
            hour-format: 24h

          - type: custom-api
            title: Agenda
            cache: 5m
            url: http://sidecar:3000/calendar.json
            template: |
              {{ if eq (len (.JSON.Array "events")) 0 }}
                <p class="color-paragraph">No events in the next two weeks.</p>
                {{ if .JSON.String "note" }}<p class="size-h6 color-negative">{{ .JSON.String "note" }}</p>{{ end }}
              {{ else }}
                <ul class="list list-gap-14">
                  {{ range .JSON.Array "events" }}
                    <li>
                      <div class="flex justify-between items-center gap-10">
                        <span class="color-highlight text-truncate">{{ .String "summary" }}</span>
                        <span class="size-h6 color-base shrink-0">{{ .String "dayLabel" }}</span>
                      </div>
                      <div class="size-h6 color-paragraph">
                        {{ .String "startLabel" }}{{ if .String "location" }} · {{ .String "location" }}{{ end }}
                      </div>
                    </li>
                  {{ end }}
                </ul>
              {{ end }}

      # ── CENTER ──────────────────────────────────────────────────────────
      - size: full
        widgets:
          # Google Calendar embed. See README "Calendar in the iframe" — the
          # calendar must be public OR the kiosk browser signed into Google,
          # otherwise this frame renders empty.
          - type: iframe
            source: ${GCAL_EMBED_URL}
            height: 620

          - type: split-column
            max-columns: 2
            widgets:
              - type: docker-containers
                title: Containers
                hide-by-default: false
                running-only: false

              - type: server-stats
                title: Raspberry Pi
                servers:
                  - type: local
                    name: pi
                    cpu-temp-sensor: ${CPU_TEMP_SENSOR}
                    hide-swap: true

          - type: monitor
            title: Services
            cache: 1m
            style: compact
            sites:
              - title: CasaOS
                url: ${CASAOS_URL}
                icon: si:homeassistantcommunitystore
              # Add your own, e.g.:
              # - title: Jellyfin
              #   url: http://192.168.1.10:8096
              #   icon: si:jellyfin

          - type: bookmarks
            title: Quick Access
            groups:
              - links:
                  - title: CasaOS
                    url: ${CASAOS_URL}
                    icon: si:homeassistantcommunitystore
                  - title: Full Calendar
                    url: https://calendar.google.com

      # ── RIGHT ───────────────────────────────────────────────────────────
      - size: small
        widgets:
          - type: custom-api
            title: Inbox
            cache: 5m
            url: http://sidecar:3000/mail.json
            template: |
              {{ if .JSON.String "note" }}
                <p class="size-h6 color-paragraph">{{ .JSON.String "note" }}</p>
              {{ else }}
                <div class="flex items-center justify-between margin-bottom-15">
                  <span class="size-h1 color-highlight">{{ .JSON.Int "unread" }}</span>
                  <span class="color-base">unread</span>
                </div>
                <ul class="list list-gap-14">
                  {{ range .JSON.Array "messages" }}
                    <li>
                      <div class="color-highlight text-truncate">{{ .String "subject" }}</div>
                      <div class="size-h6 color-paragraph flex justify-between gap-10">
                        <span class="text-truncate">{{ .String "from" }}</span>
                        <span class="shrink-0">{{ .String "date" }}</span>
                      </div>
                    </li>
                  {{ end }}
                </ul>
              {{ end }}

          # Glance's native `todo` widget is unreleased as of v0.8.6, and the
          # `html` widget renders raw source with no card/header — so we draw the
          # whole widget shell by hand here. Edit the <li> list to taste, or swap
          # this for a `bookmarks` widget / a custom-api pointed at a task backend.
          - type: html
            source: |
              <div class="widget widget-type-html">
                <div class="widget-header"><h2 class="uppercase">Tasks</h2></div>
                <div class="widget-content">
                  <ul class="list list-gap-10 ccc-tasks">
                    <li><input type="checkbox"> <span>Back up CasaOS config</span></li>
                    <li><input type="checkbox"> <span>Update containers</span></li>
                    <li><input type="checkbox"> <span>Check disk usage</span></li>
                  </ul>
                </div>
              </div>

          - type: rss
            title: News
            style: vertical-list
            limit: 12
            collapse-after: 6
            cache: 30m
            feeds:
              - url: https://feeds.arstechnica.com/arstechnica/index
                title: Ars Technica
              - url: https://hnrss.org/frontpage
                title: Hacker News
